[project]
name = "vayukavach-jobs"
version = "0.1.0"
description = "Hourly collectors and nightly jobs for VayuKavach, run by GitHub Actions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "vayukavach-backend",
]

[tool.uv.sources]
vayukavach-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["collectors", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
