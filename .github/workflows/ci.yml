name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vayu
          POSTGRES_PASSWORD: vayu
          POSTGRES_DB: vayukavach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayu -d vayukavach"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vayu:vayu@localhost:5432/vayukavach
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  jobs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vayu
          POSTGRES_PASSWORD: vayu
          POSTGRES_DB: vayukavach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vayu -d vayukavach"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vayu:vayu@localhost:5432/vayukavach
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
