name: Deploy

# Ship only after CI passes on main: the API through Render's API, the frontend with the
# Vercel CLI (the Vercel project is not linked to GitHub, so this is its only deploy path).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dc2leps0916s73ag5ht0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_3mAKb4Z5KXf4EmbdwpUigwLL
      VERCEL_PROJECT_ID: prj_d6ohWvHodRhAaRSi5pMdJqe9jpfk
      API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy API (Render)
        if: env.RENDER_API_KEY != ''
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' > /dev/null && echo "Render deploy started"
      - name: Deploy frontend (Vercel)
        if: env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: npx --yes vercel@66 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Wait for the API to be healthy
        if: env.API_URL != '' && env.RENDER_API_KEY != ''
        run: |
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 "$API_URL/health" | grep -q '"database":"ok"'; then
              echo "API healthy"; exit 0
            fi
            sleep 20
          done
          echo "::error::API did not become healthy after deploy"; exit 1
      - name: Nothing configured
        if: env.RENDER_API_KEY == '' && env.VERCEL_TOKEN == ''
        run: echo "::notice::No RENDER_API_KEY or VERCEL_TOKEN secret; skipping."
