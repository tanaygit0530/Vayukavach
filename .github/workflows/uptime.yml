name: Uptime

# Every hour: /health must answer with the database reachable. Hourly, not more often: Render's
# free hours are shared by every service in the workspace, and pinging every 10 minutes would
# keep this one awake all month. A cold start takes up to ~1 minute, so each check retries. When down,
# the operator gets an email / WhatsApp / SMS through the app's own alert channels.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - name: Check /health
        id: health
        if: env.API_URL != ''
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 90 "$API_URL/health" || true)
            if echo "$body" | grep -q '"database":"ok"'; then echo "up: $body"; exit 0; fi
            echo "attempt $i failed: ${body:-no response}"; sleep 30
          done
          echo "down=true" >> "$GITHUB_OUTPUT"; exit 1
      - uses: actions/checkout@v4
        if: failure() && steps.health.outputs.down == 'true'
      - uses: astral-sh/setup-uv@v6
        if: failure() && steps.health.outputs.down == 'true'
        with:
          python-version: "3.11"
      - name: Notify the operator
        if: failure() && steps.health.outputs.down == 'true'
        working-directory: backend
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          uv sync --locked --no-dev --quiet
          uv run --no-dev python -m app.alerts.notify "VayuKavach API is not healthy at $API_URL (checked $(date -u +%H:%MZ)). Render dashboard: https://dashboard.render.com"
