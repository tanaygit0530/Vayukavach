name: Collect hourly

on:
  schedule:
    # Off the busy top of the hour (GitHub delays or drops scheduled runs under load).
    - cron: "23 * * * *" # minute 23 UTC = :53 IST
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (cloud, openaq, openmeteo-air, weather, summarize). CPCB runs on a machine in India: data.gov.in refuses GitHub runners."
        default: cloud

concurrency:
  group: collect-hourly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      # alerts (optional: without them the alerts job is logged as skipped)
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
      # Supabase free tier is 500 MB; see docs/README.md "Storage".
      OPENAQ_BACKFILL_DAYS: ${{ vars.OPENAQ_BACKFILL_DAYS || '30' }}
      OPENAQ_REFERENCE_ONLY: ${{ vars.OPENAQ_REFERENCE_ONLY || '1' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set; skipping collection."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.11"
      - name: Apply migrations
        if: steps.config.outputs.ready == 'true'
        working-directory: backend
        run: uv sync --locked && uv run alembic upgrade head
      - name: Run collectors
        if: steps.config.outputs.ready == 'true'
        working-directory: jobs
        run: uv sync --locked && uv run python run.py "${{ inputs.job || 'cloud' }}"
