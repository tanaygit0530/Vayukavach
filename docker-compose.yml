services:
  db:
    image: postgres:16-alpine
    container_name: vayukavach-db
    environment:
      POSTGRES_USER: vayu
      POSTGRES_PASSWORD: vayu
      POSTGRES_DB: vayukavach
    ports:
      - "5433:5432"
    volumes:
      - vayu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayu -d vayukavach"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vayu_pgdata:
